[package]
name = "x-planets-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web/WASM platform backend for x-planets"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
x-planets-core = { workspace = true }
x-planets-render = { workspace = true }
x-planets-gpu = { workspace = true }
x-planets-math = { workspace = true }
x-planets-tiles = { workspace = true }
wgpu = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "DomRect",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    # Input events
    "MouseEvent",
    "WheelEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "KeyboardEvent",
    # Event listener options (passive: false for touch/wheel)
    "AddEventListenerOptions",
    # Timing
    "Performance",
    # Custom events (xplanets-ready notification)
    "CustomEvent",
    "Event",
] }
js-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
