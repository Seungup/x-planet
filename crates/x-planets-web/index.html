<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>x-planets</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2640; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }

        /* Projection switcher — mobile-friendly (min 48×48 tap target) */
        #proj-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            min-width: 48px;
            min-height: 48px;
            padding: 10px 16px;
            border: none;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        #proj-btn:hover  { background: rgba(0, 0, 0, 0.7); }
        #proj-btn:active { background: rgba(0, 0, 0, 0.85); transform: scale(0.95); }

        /* Safe area inset for notched phones */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            #proj-btn { bottom: calc(20px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <canvas id="x-planets-canvas"></canvas>
    <button id="proj-btn" aria-label="Switch map projection">Web Mercator</button>
</body>
</html>
