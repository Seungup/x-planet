[package]
name = "x-planets-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core map engine: rendering pipeline, viewport, and tile layer management"

[features]
default = ["gpu"]
gpu = ["dep:x-planets-gpu", "dep:wgpu"]

[dependencies]
x-planets-math = { workspace = true }
x-planets-gpu = { workspace = true, optional = true }
x-planets-projection = { workspace = true }
x-planets-tiles = { workspace = true }
wgpu = { workspace = true, optional = true }
glam = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
