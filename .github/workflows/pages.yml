name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: wasm-

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build WASM
        run: |
          cd crates/x-planets-web
          trunk build --release --public-url /x-planet/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/x-planets-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
