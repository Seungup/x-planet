[workspace]
resolver = "2"
members = [
    "crates/x-planets-math",
    "crates/x-planets-gpu",
    "crates/x-planets-projection",
    "crates/x-planets-tiles",
    "crates/x-planets-core",
    "crates/x-planets-native",
    "crates/x-planets-web",
    "crates/x-planets-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/x-planets/x-planets"

[workspace.dependencies]
# Math
glam = "0.29"

# GPU
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
naga = { version = "23", features = ["wgsl-in", "wgsl-out"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Window / Platform
winit = "0.30"
pollster = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Internal crates
x-planets-math = { path = "crates/x-planets-math" }
x-planets-gpu = { path = "crates/x-planets-gpu" }
x-planets-projection = { path = "crates/x-planets-projection" }
x-planets-tiles = { path = "crates/x-planets-tiles" }
x-planets-core = { path = "crates/x-planets-core" }
x-planets-native = { path = "crates/x-planets-native" }
x-planets-web = { path = "crates/x-planets-web" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
